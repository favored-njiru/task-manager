<div class="min-h-screen w-full bg-blue-50 flex flex-col items-center px-4 py-8">

  <h3 class="text-bold text-blue-700 mb-2">{{date|date}} </h3>

  <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-800 tracking-wide">TASK MANAGER</h1>
  </header>

 






  <main class="w-full max-w-3xl flex flex-col gap-6">

    <section class="bg-white p-6 rounded-xl border border-blue-200 shadow-sm">
      <h2 class="text-lg font-semibold text-blue-500 mb-4">
          ADD A TASK
      </h2>

      <div class="flex flex-col sm:flex-row gap-3">
          <input #taskInput type="text" placeholder="Input task"
          class="flex-1 border border-blue-200 h-12 p-3 rounded-md text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300"
         >
         <button class="bg-blue-400 text-white px-9 py-3 rounded-lg hover:bg-blue-500 transition-colors" (click)="addTask(taskInput.value); taskInput.value=''" >add task</button>
      </div>
    </section>

    <section class="bg-blue-100 p-6 rounded-xl border border-blue-200 shadow-sm">
      <h2 class="text-xl font-semibold text-blue-500 mb-4">MY TASKS
        
      </h2>
     

      <div class="flex flex-col gap-3">
      <div class="relative w-full max-w-md">
        <input type="text" placeholder="Search tasks" #filter
          class="w-full border border-blue-200 h-12 pl-3 pr-11 rounded-md text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300"
        />
        <button
          class="absolute right-1.5 top-1/2 -translate-y-1/2 flex items-center justify-center w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-700 text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1"
          (click)="search(filter.value)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.602 10.602z" />
          </svg>
        </button>
      </div>
               @for(task of filteredDoneTasks() ;track task.title){

                 @if(!task === null){
                  <p>{{task.title}}</p>
                 }

          <div class="flex flex-col sm:flex-row justify-between items-center gap-3 bg-white p-4 rounded-lg border border-blue-100 shadow-sm">

            <h3
              class="text-gray-600 font-medium text-center sm:text-left"
              [class.line-through]="task.completed" >
              {{ task.title }}
            </h3>
          

            <div class="flex gap-2 items-center">
              <button
                class="rounded-lg bg-blue-300 text-white px-5 py-1 hover:bg-blue-400 transition-colors"
                (click)="doneTask(task)">
              done
              </button>

              <button
                class="text-white bg-red-300 rounded-lg px-5 py-1 hover:bg-red-600 transition-colors"
                (click)="deleteTask(task)"
              >
                delete
              </button>
            </div>

          </div>
        }
      </div>

    </section>
  </main>
